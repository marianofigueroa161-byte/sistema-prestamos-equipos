<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Préstamos de Equipos</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <h1>Préstamos de equipos tecnológicos</h1>
  </header>
  <main class="container">
    <section class="stats" aria-label="Resumen del inventario">
      <article><span>Total</span><strong id="totalCount">0</strong></article>
      <article><span>Disponibles</span><strong id="availableCount">0</strong></article>
      <article><span>Prestados</span><strong id="loanedCount">0</strong></article>
      <article><span>Vencidos</span><strong id="overdueCount">0</strong></article>
      <article><span>Mantenimiento</span><strong id="maintenanceCount">0</strong></article>
    </section>
    <section class="panel">
      <div class="section-heading">
        <h2 id="formTitle">Nuevo equipo</h2>
      </div>
      <form id="equipmentForm">
        <div class="form-grid">
          <label>Código<input id="code" type="text" maxlength="20" required></label>
          <label>Tipo<select id="type" required><option value="">Seleccione</option><option>Laptop</option><option>Proyector</option><option>Tablet</option><option>Monitor</option><option>Otro</option></select></label>
          <label>Marca<input id="brand" type="text" maxlength="40" required></label>
          <label>Modelo<input id="model" type="text" maxlength="50" required></label>
          <label>Responsable<input id="responsible" type="text" maxlength="80"></label>
          <label>Área solicitante<input id="area" type="text" maxlength="80"></label>
          <label>Fecha de préstamo<input id="loanDate" type="date"></label>
          <label>Fecha prevista de devolución<input id="dueDate" type="date"></label>
          <label>Estado<select id="status" required><option>Disponible</option><option>Prestado</option><option>Mantenimiento</option></select></label>
          <label class="wide">Observaciones<textarea id="notes" rows="3" maxlength="250"></textarea></label>
        </div>
        <p id="formMessage" class="message" role="alert"></p>
        <div class="actions">
          <button id="submitButton" class="primary" type="submit">Guardar equipo</button>
          <button id="cancelButton" class="secondary hidden" type="button">Cancelar edición</button>
        </div>
      </form>
    </section>
    <section class="panel">
      <div class="section-heading">
        <h2>Equipos registrados</h2>
      </div>
      <div class="filters">
        <input id="equipmentSearch" type="search" aria-label="Buscar equipos">
        <select id="statusFilter">
          <option value="Todos">Todos los estados</option>
          <option>Disponible</option>
          <option>Prestado</option>
          <option>Mantenimiento</option>
          <option>Vencido</option>
        </select>
      </div>
      <div id="equipmentList" class="card-list"></div>
    </section>
    <section class="panel">
      <div class="section-heading">
        <h2>Historial de préstamos y devoluciones</h2>
        <button id="clearHistoryButton" class="danger-outline" type="button">Limpiar historial</button>
      </div>
      <div class="filters">
        <input id="historySearch" type="search" aria-label="Buscar historial">
        <select id="historyFilter">
          <option value="Todos">Todos los resultados</option>
          <option>Devuelto a tiempo</option>
          <option>Devuelto con retraso</option>
        </select>
      </div>
      <div id="historyList" class="card-list"></div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
